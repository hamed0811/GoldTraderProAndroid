name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../GoldTraderPro-Android-v1.2.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GoldTraderPro-Android-debug
          path: android/GoldTraderPro-Android-v1.2.0-debug.apk
      - name: Publish APK to GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v1.2.0-build-${{ github.run_number }}"
          gh release create "$TAG"             "android/GoldTraderPro-Android-v1.2.0-debug.apk"             --repo "${{ github.repository }}"             --title "GoldTrader Pro Android v1.2.0 Build ${{ github.run_number }}"             --notes "Installable Android Debug APK built by GitHub Actions. Order entry is disabled."             --target "${{ github.sha }}"
