name: Build GoldTrader Pro Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "goldmind-ai/backend/**"
      - "goldmind-ai/windows/**"
      - ".github/workflows/windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r goldmind-ai/windows/requirements-windows.txt

      - name: Compile sources
        run: |
          python -m py_compile goldmind-ai/backend/main.py
          python -m py_compile goldmind-ai/backend/telegram_notifier.py
          python -m py_compile goldmind-ai/windows/windows_app.py

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --name GoldTraderPro-Windows-x64 --paths goldmind-ai/backend --hidden-import telegram_notifier goldmind-ai/windows/windows_app.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/GoldTraderPro-Windows-x64.exe")) { throw "Windows EXE was not created." }
          Get-Item "dist/GoldTraderPro-Windows-x64.exe" | Format-List Name,Length,FullName

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GoldTraderPro-Windows-x64
          path: dist/GoldTraderPro-Windows-x64.exe
          if-no-files-found: error
